<script>
(function(){
'use strict';
/* ───────── 데이터 ───────── */
const read = id => JSON.parse(document.getElementById(id).textContent);
const COPY = read('copy-data');
const RECIPES = read('recipes-data');
const FRIDGE_DATA = read('fridge-data');
const ICON_MAP = read('iconmap-data');
const ICON_SRC = read('icons-data');

const CATS = FRIDGE_DATA.master;                       // { '야채·과일':[...], ... }
const CAT_ORDER = ['야채·과일','고기·해산물','양념류'];
const SHELF_KEY = {'야채·과일':'shelfVegetable','고기·해산물':'shelfProtein','양념류':'shelfDoor'};
const MASTER = new Set(Object.values(CATS).flat());
const catOf = n => CAT_ORDER.find(c => CATS[c].includes(n));
const DISH_ICON = {'찌개·국':'soup','조림·찜':'cooking-pot','볶음':'utensils-crossed','볶음밥':'egg-fried','덮밥':'utensils','부침·전':'chef-hat','무침·샐러드':'salad'};
const TAG_ORDER = ['lack_ingredient','no_spicy','too_long','too_hard','want_different','recently_ate'];
const LIST_LOADING_MS = 700;   // 화면 2 로딩 (기획안 약 0.7초)
const RE_LOADING_MS = 800;     // 화면 5 로딩 (기획안 약 0.8초)
const FRIDGE_KEY = 'naengbu:fridge:v1';
const SESSION_KEY = 'naengbu:session:v2';

/* ───────── 문구 ───────── */
function t(path, vars){
  const s = path.split('.').reduce((o,k) => (o == null ? o : o[k]), COPY);
  if (typeof s !== 'string') return path;
  return s.replace(/\{(\w+)\}/g, (m,k) => (vars && k in vars ? vars[k] : m));
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lu = (name, extra='') => `<i data-lucide="${name}" aria-hidden="true"${extra}></i>`;

/* ───────── 날짜 ───────── */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function today0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(n){ const d = today0(); d.setDate(d.getDate()+n); return iso(d); }
function daysLeft(exp){ const [y,m,d] = exp.split('-').map(Number); return Math.round((new Date(y,m-1,d) - today0())/864e5); }

/* ───────── 상태 ───────── */
const S = {
  items: [],                 // {name, category, expiryDate, fromReceipt}
  sel: new Set(),            // 화면 1 선택 재료 (저장 안 함)
  view: 'fridge',            // fridge | list | feedback | re
  mode: 'urgent',            // urgent | picked
  addOpen: false, addTab: 'manual', receiptPreview: null, receiptDone: false, creditsOpen: false,
  listLoading: false, pickedName: null, notice: null, lastRemoved: null,
  openSteps: new Set(), liked: {},
  session: { rejected: [], round: 1 },
  reHistory: [],             // 피드백 직전 상태 (이전 레시피로 돌아가기)
  fb: { from: 'list', targets: [], tags: [], error: false },
  re: { loading: false, recipes: [], prev: [], relaxed: false, tags: [], cooked: new Set(), lastCooked: null }
};

function saveFridge(){ try{ localStorage.setItem(FRIDGE_KEY, JSON.stringify(S.items)); }catch(e){} }
function loadFridge(){
  try{
    const v = JSON.parse(localStorage.getItem(FRIDGE_KEY) || '[]');
    if (Array.isArray(v)) S.items = v.filter(x => x && MASTER.has(x.name) && /^\d{4}-\d{2}-\d{2}$/.test(x.expiryDate))
      .map(x => ({name:x.name, category:catOf(x.name), expiryDate:x.expiryDate, addedDate: /^\d{4}-\d{2}-\d{2}$/.test(x.addedDate) ? x.addedDate : iso(today0()), fromReceipt:!!x.fromReceipt}));
  }catch(e){}
}
function saveSession(){ try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify(S.session)); }catch(e){} }
function resetSession(){ S.session = { rejected: [], round: 1 }; saveSession(); }

const find = n => S.items.find(x => x.name === n);
const dOf = n => { const x = find(n); return x ? daysLeft(x.expiryDate) : null; };
function addItem(name, days, fromReceipt, shelfDays){
  if (find(name)) return;
  S.items.push({ name, category: catOf(name), expiryDate: addDays(days), addedDate: addDays(days - (shelfDays || days)), fromReceipt: !!fromReceipt });
}
function removeItem(name){ S.items = S.items.filter(x => x.name !== name); S.sel.delete(name); }

/* ───────── 표시 조각 ───────── */
function badge(d){
  if (d < 0) return `<span class="dd dd-x">${esc(t('badge.expired'))}</span>`;
  const lv = d <= 3 ? 'r' : d <= 7 ? 'o' : 'g';
  return `<span class="dd dd-${lv}"><span class="dot"></span>${esc(d === 0 ? t('badge.today') : t('badge.daysLeft',{n:d}))}</span>`;
}
function freshBar(x){
  const total = daysLeft(x.expiryDate) - daysLeft(x.addedDate || iso(today0()));
  const pct = L.freshnessPercent(x.d, total);
  const lv = x.d < 0 ? 'x' : x.d <= 3 ? 'r' : x.d <= 7 ? 'o' : 'g';
  const label = x.d < 0 ? t('badge.expired') : x.d === 0 ? t('badge.today') : t('badge.daysLeft',{n:x.d});
  return `<span class="fresh fresh-${lv}"><span class="fresh-label">${esc(label)}</span><span class="fresh-track" aria-hidden="true"><i style="width:${pct}%"></i></span></span>`;
}
function ingIcon(name, big){
  const m = ICON_MAP.icons[name];
  const cls = big ? 'ico ico-40' : 'ico';
  if (m && ICON_SRC[m.file]) return `<img class="${cls}" src="${ICON_SRC[m.file]}" alt="" width="${big?40:20}" height="${big?40:20}">`;
  return `<span class="${cls} ico-fallback" aria-hidden="true">${esc(name[0])}</span>`;
}
const dishIcon = r => DISH_ICON[r.dishType] || 'soup';
const metaText = r => t('card.difficulty.' + r.difficulty) + (r.isSpicy ? ' · ' + t('card.spicy') : '');

/* ───────── 추천 규칙 → js/logic.js (window.Logic) ───────── */
const L = window.Logic;
const SEASONING = new Set(CATS['양념류']);
const fridgeNow = () => S.items.map(x => ({ name: x.name, daysLeft: daysLeft(x.expiryDate) }));
const withR = e => (e.r = e.recipe, e);
function buildCtx(){ return L.buildContext({ fridge: fridgeNow(), mode: S.mode, selected: [...S.sel] }); }
function evaluate(r, ctx){ return withR(L.evaluate(r, ctx)); }
function recommendList(){
  return L.recommend({ recipes: RECIPES, fridge: fridgeNow(), mode: S.mode, selected: [...S.sel], excludeIds: S.session.rejected }).map(withR);
}
function buildReason(e, tags){
  return L.buildReason({ mineDays: e.mine.map(n => [n, dOf(n)]), cookTimeMin: e.r.cookTimeMin, tags: tags || [] }, COPY);
}
function buildChanged(tags){ return L.buildChanged(tags, COPY); }

/* ───────── 화면 5 재추천: 비평 기반 + 조건 완화 (AI 호출 없음, docs/plan.md 4장) ───────── */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function runRerecommend(){
  S.re.loading = true; S.notice = null; render();
  await sleep(RE_LOADING_MS);
  const res = L.rerecommend({
    recipes: RECIPES, fridge: fridgeNow(), mode: S.mode, selected: [...S.sel],
    tags: S.re.tags, excludeIds: S.session.rejected,
    seenDishTypes: [...new Set(S.fb.targets.map(r => r.dishType))]
  });
  S.re.loading = false;
  S.re.recipes = res.items.map(e => withR(e)).map(e => ({ r: e.r, reason: buildReason(e, S.re.tags), changed: buildChanged(S.re.tags) }));
  S.re.relaxed = res.relaxed; S.re.cooked = new Set();
  S.re.prev = res.items.length ? [] : previousRecipes();
  render();
}
function previousRecipes(){
  const last = S.reHistory[S.reHistory.length - 1];
  if (!last) return [];
  if (last.view === 're') return last.re.recipes.map(x => ({ r: x.r, reason: x.reason }));
  return L.recommend({ recipes: RECIPES, fridge: fridgeNow(), mode: S.mode, selected: [...S.sel], excludeIds: last.session.rejected })
    .map(withR).map(e => ({ r: e.r, reason: buildReason(e) }));
}

/* ───────── 카드 ───────── */
function honeyFor(name){
  const base = RECIPES.find(r => r.name === name);       // 꿀조합은 recipes.json 시드에서만
  if (!base || !base.honeyTips || !base.honeyTips.length) return [];
  return base.honeyTips.slice().sort((a,b) => b.helpfulCount - a.helpfulCount).slice(0,2);
}
function chips(e){
  return e.mine.map(n => `<span class="ic mine">${ingIcon(n)}${esc(n)}${badge(dOf(n))}</span>`).join('')
    + e.inFridge.map(n => `<span class="ic infridge">${ingIcon(n)}${esc(n)}<small>${esc(t('card.inFridge'))}</small></span>`).join('')
    + e.missing.map(n => {
        const d = dOf(n);
        return d !== null && d < 0
          ? `<span class="ic miss">${ingIcon(n)}${esc(n)}${badge(d)}</span>`
          : `<span class="ic miss">${ingIcon(n)}${esc(t('card.missing',{name:n}))}</span>`;
      }).join('');
}
function card(r, opt){
  const e = evaluate(r, buildCtx());
  const key = (opt.screen) + ':' + r.name;
  const tips = honeyFor(r.name);
  let h = `<article class="card"><div class="band">${lu(dishIcon(r))}</div>`;
  h += `<div class="card-body">`;
  if (opt.isNew) h += `<span class="new">${esc(t('card.new'))}</span>`;
  h += `<div class="title"><h3>${esc(r.name)}</h3><span class="time">${lu('clock')}${esc(t('card.minutes',{n:r.cookTimeMin}))}</span></div>`;
  h += `<p class="cap meta">${esc(metaText(r))}</p>`;
  if (opt.changed) h += `<p class="changed">${esc(opt.changed)}</p>`;
  h += `<div class="ing">${chips(e)}</div>`;
  h += `<details class="steps" data-steps="${esc(key)}"${S.openSteps.has(key) ? ' open' : ''}><summary>${esc(t('card.steps'))}${lu('chevron-down')}</summary><ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></details>`;
  h += `<div class="box why"><div class="box-head">${lu('sparkles')}${esc(t('card.reasonLabel'))}</div><p>${esc(opt.reason)}</p></div>`;
  if (tips.length){
    h += `<div class="box honey"><div class="box-head">${lu('lightbulb')}${esc(t('card.honeyLabel'))}</div>` + tips.map((tp,i) => {
      const lk = r.name + '#' + i, on = !!S.liked[lk], n = tp.helpfulCount + (on ? 1 : 0);
      return `<div class="tip"><span>${esc(tp.text)}</span><button class="like" data-act="like" data-key="${esc(lk)}" data-base="${tp.helpfulCount}" aria-pressed="${on}" aria-label="${esc(t('card.helpfulLabel',{n}))}">${lu('thumbs-up')}<b style="font-weight:500">${n}</b></button></div>`;
    }).join('') + `</div>`;
  }
  h += `<div class="actions">${opt.actions}</div></div></article>`;
  return h;
}
function skeletons(n){
  return Array.from({length:n}, () => `<div class="sk" aria-hidden="true"><div class="skb"></div><div><i style="width:60%"></i><i style="width:85%"></i><i style="height:56px"></i></div></div>`).join('');
}
function cookedNotice(){
  if (!S.notice) return '';
  return `<div class="notice" role="status"><span class="notice-ico" aria-hidden="true">${lu('chef-hat')}</span><p>${esc(S.notice)}</p><button class="btn btn-s" data-act="undo">${lu('undo-2')}${esc(t('card.undo'))}</button></div>`;
}

/* ───────── 화면 1 · 내 냉장고 ───────── */
function viewFridge(){
  const items = S.items.map(x => ({ ...x, d: daysLeft(x.expiryDate) }));
  const sum = L.fridgeSummary(items.map(x => ({ name: x.name, daysLeft: x.d })));
  let h = `<header class="apphead">${lu('refrigerator')}${esc(t('app.title'))}</header>`;
  h += `<h1>${esc(t('fridge.title'))}</h1><p class="lead">${esc(t('fridge.lead'))}</p>`;
  if (items.length){
    if (sum.expired.length) h += `<div class="summary"><span class="dd dd-x">${esc(t('badge.expired'))}</span>${esc(t('fridge.summaryExpired',{n:sum.expired.length, list:sum.expired.join(', ')}))}</div>`;
    h += sum.urgent.length
      ? `<div class="summary"><span class="dd dd-r"><span class="dot"></span>${esc(t('fridge.summaryUrgentBadge'))}</span>${esc(t('fridge.summaryUrgent',{n:sum.urgent.length}))}</div>`
      : `<div class="summary"><span class="dd dd-g"><span class="dot"></span>${esc(t('fridge.summaryCalmBadge'))}</span>${esc(t('fridge.summaryCalm'))}</div>`;
  }
  h += `<section class="fridge" aria-label="${esc(t('fridge.title'))}">`;
  if (!items.length){
    h += `<div class="fridge-empty"><p>${esc(t('fridge.empty'))}</p><button class="btn btn-s" data-act="fill">${esc(t('fridge.fillSample'))}</button></div>`;
  } else {
    CAT_ORDER.forEach(c => {
      const list = items.filter(x => x.category === c).sort((a,b) => a.d - b.d);
      if (!list.length) return;
      h += `<div class="shelf"><h3>${esc(t('fridge.' + SHELF_KEY[c]))}</h3><div class="tiles">` + list.map(x => {
        const on = S.sel.has(x.name);
        return `<button class="tile${x.name.length >= 4 ? ' long' : ''}${x.d < 0 ? ' expired' : ''}" data-act="sel" data-n="${esc(x.name)}" aria-pressed="${on}">${on ? `<span class="ck">${lu('check')}</span>` : ''}${ingIcon(x.name, true)}<span class="tile-name">${esc(x.name)}</span>${freshBar(x)}</button>`;
      }).join('') + `</div></div>`;
    });
  }
  h += `</section>`;
  if (items.length) h += `<p class="cap hint">${esc(t('fridge.hint'))}</p>`;
  h += `<button class="btn btn-s" data-act="toggleAdd" aria-expanded="${S.addOpen}" aria-controls="addArea">${lu(S.addOpen ? 'x' : 'plus')}${esc(t(S.addOpen ? 'fridge.addClose' : 'fridge.addOpen'))}</button>`;
  if (S.addOpen){
    h += `<div id="addArea"><div class="tabs" role="tablist">
      <button class="chip" role="tab" data-act="tab" data-tab="manual" aria-selected="${S.addTab === 'manual'}">${esc(t('fridge.tabManual'))}</button>
      <button class="chip" role="tab" data-act="tab" data-tab="receipt" aria-selected="${S.addTab === 'receipt'}">${esc(t('fridge.tabReceipt'))}</button></div>`;
    if (S.addTab === 'manual'){
      h += `<div class="panel" role="tabpanel">` + CAT_ORDER.map(c => `<div class="cat"><h3>${esc(c)}</h3><div class="chips">` +
        CATS[c].map(n => { const on = !!find(n); return `<button class="chip" data-act="chip" data-n="${esc(n)}" aria-pressed="${on}">${ingIcon(n)}${esc(n)}<span class="ck">${lu('check')}</span></button>`; }).join('') +
        `</div></div>`).join('') + `</div>`;
    } else {
      h += `<div class="panel" role="tabpanel">
        <input type="file" id="receiptFile" accept="image/*" class="sr">
        <label for="receiptFile" class="drop">${S.receiptPreview
          ? `<img src="${S.receiptPreview}" alt="${esc(t('fridge.receiptPreviewAlt'))}"><span>${esc(t('fridge.receiptChange'))}</span>`
          : `${lu('camera')}<span>${esc(t('fridge.receiptUpload'))}</span>`}</label>
        <button class="btn btn-s" data-act="scan" style="margin-top:16px"${S.receiptPreview ? '' : ' disabled'}>${esc(t('fridge.receiptScan'))}</button>
        <p class="cap receipt-note${S.receiptDone ? ' done' : ''}" role="status">${esc(t(S.receiptDone ? 'fridge.receiptDone' : 'fridge.receiptDemoNote'))}</p></div>`;
    }
    h += `<div class="panel"><h2 class="list-title">${esc(t('fridge.listTitle'))}<span class="cap">${esc(t('fridge.listCount',{n:items.length}))}</span></h2>`;
    h += items.length ? items.slice().sort((a,b) => a.d - b.d).map(x => {
      const status = x.d < 0 ? t('fridge.expired') : x.d === 0 ? t('fridge.today') : t('fridge.daysLeft',{n:x.d});
      return `<div class="row"><div class="rowtop">${ingIcon(x.name)}<b>${esc(x.name)}</b>${badge(x.d)}${x.fromReceipt ? `<span class="tag">${esc(t('fridge.receiptTag'))}</span>` : ''}
        <button class="rm" data-act="remove" data-n="${esc(x.name)}" aria-label="${esc(t('fridge.remove',{name:x.name}))}">${lu('x')}</button></div>
        <label class="exp">${esc(t('fridge.expiryLabel'))}<input type="date" data-exp="${esc(x.name)}" value="${x.expiryDate}"><span class="left${x.d < 0 ? ' over' : ''}">${esc(status)}</span></label></div>`;
    }).join('') : `<p class="empty-line">${esc(t('fridge.listEmpty'))}</p>`;
    h += `</div></div>`;
  }
  h += `<div class="cta"><button class="btn btn-p" data-act="go" data-mode="urgent"${items.length < 2 ? ' disabled' : ''}>${esc(t('fridge.goUrgent'))}</button>
    <button class="btn btn-s" data-act="go" data-mode="picked"${S.sel.size < 2 ? ' disabled' : ''}>${esc(S.sel.size ? t('fridge.goPickedCount',{n:S.sel.size}) : t('fridge.goPicked'))}</button></div>`;
  h += `<div class="credits"><button class="textbtn" data-act="credits" aria-expanded="${S.creditsOpen}">${esc(t('app.iconCredits'))}</button>`;
  if (S.creditsOpen){
    h += `<ul>` + Object.values(ICON_MAP.icons).filter(v => v.source).map(v => `<li><a href="${esc(v.source)}" target="_blank" rel="noopener">${esc(t('app.iconCreditsLine',{iconTitle:v.title, author:v.author}))}</a></li>`).join('') + `</ul>`;
  }
  h += `</div>`;
  return { html: h };
}

/* ───────── 화면 2·3 · 오늘의 추천 레시피 ───────── */
function viewList(){
  let h = `<header class="apphead">${lu('refrigerator')}${esc(t('app.title'))}</header>`;
  h += `<h1>${esc(t('today.title'))}</h1>`;
  if (S.listLoading){
    h += `<p class="lead">${esc(t('recipeList.loading'))}</p>` + skeletons(3);
  } else {
    const list = recommendList();
    // 해 먹은 직후에는 안내 칸만 보여 주고 리드 문구·빈 결과 문구는 숨겨요
    if (!S.notice) h += `<p class="lead">${esc(S.mode === 'urgent' ? t('recipeList.leadUrgent') : t('recipeList.leadPicked',{n:S.sel.size}))}</p>`;
    h += cookedNotice();
    if (!list.length && !S.notice){
      h += `<div class="empty"><p>${esc(t('recipeList.empty'))}</p></div>`;
    } else if (list.length){
      h += list.map((e,i) => {
        const picked = S.pickedName === e.r.name;
        const actions = `<button class="btn ${i === 0 ? 'btn-p' : 'btn-s'}" data-act="pick" data-n="${esc(e.r.name)}">${picked ? lu('check') + esc(t('card.picked')) : esc(t('card.pick'))}</button>
          <button class="btn btn-s" data-act="reject" data-n="${esc(e.r.name)}">${esc(t('card.reject'))}</button>`
          + (picked ? `<button class="btn btn-s" data-act="cook" data-n="${esc(e.r.name)}">${esc(t('card.cooked'))}</button>` : '');
        return card(e.r, { screen: 'list', reason: buildReason(e), actions });
      }).join('');
    }
  }
  h += `<button class="btn btn-s" data-act="toFridge" style="margin-top:8px">${esc(t('recipeList.back'))}</button>`;
  return { html: h };
}

/* ───────── 화면 4 · 피드백 선택 ───────── */

  const tg = S.fb.targets;
  let h = `<div class="topbar"><button class="back" data-act="fbBack" aria-label="${esc(t('feedback.back'))}">${lu('chevron-left')}</button></div>`;
  h += `<h1>${esc(t('feedback.title'))}</h1><p class="cap" style="margin-top:4px">${esc(t('feedback.lead'))}</p>`;
  if (tg.length === 1){
    const r = tg[0];
    h += `<div class="mini"><span class="mb">${lu(dishIcon(r))}</span><div><b>${esc(r.name)}</b><span class="cap">${esc(t('card.minutes',{n:r.cookTimeMin}) + ' · ' + t('card.difficulty.' + r.difficulty))}</span></div></div>`;
  } else {
    h += `<div class="mini"><span class="mb">${lu('utensils')}</span><div><b>${esc(t('feedback.targetMulti',{n:tg.length}))}</b><span class="cap">${esc(tg.map(r => r.name).join(', '))}</span></div></div>`;
  }

  return { html: h, dock: `<button class="btn btn-p" data-act="submitFb">${esc(t('feedback.submit'))}</button>` };

/* ───────── 화면 5 · 피드백 반영 재추천 ───────── */
function viewRe(){
  let h = `<div class="topbar"><button class="back" data-act="reBack" aria-label="${esc(t('rerecommend.back'))}">${lu('chevron-left')}</button><span class="cap">${esc(t('rerecommend.round',{n:S.session.round}))}</span></div>`;
  h += `<h1>${esc(t('rerecommend.title'))}</h1><p class="lead">${esc(t('rerecommend.lead'))}</p>`;
  h += `<section class="fb" aria-label="${esc(t('rerecommend.reflectedLabel'))}"><p>${esc(t('rerecommend.reflectedLabel'))}</p><div class="chips">` +
    TAG_ORDER.filter(k => S.re.tags.includes(k)).map(k => `<span class="fb-chip">${esc(t('feedback.tags.' + k))}</span>`).join('') + `</div></section>`;
  h += `<h2 class="sec">${esc(t('rerecommend.section'))}</h2>`;
  if (S.re.loading){
    h += `<p class="cap" style="margin-bottom:12px">${esc(t('rerecommend.loading'))}</p>` + skeletons(3);
    return { html: h, dock: `<button class="btn btn-p" disabled>${esc(t('rerecommend.again'))}</button><p class="cap">${esc(t('rerecommend.againNote'))}</p>` };
  }
  h += cookedNotice();
  {
    if (S.re.relaxed && S.re.recipes.length) h += `<div class="notice soft">${esc(t('rerecommend.relaxed'))}</div>`;
    if (S.re.recipes.length < 3){
      h += `<div class="notice"><p>${esc(t('rerecommend.exhausted'))}</p><div class="btns"><button class="btn btn-s" data-act="toFridge">${esc(t('rerecommend.addIngredient'))}</button><button class="btn btn-s" data-act="again">${esc(t('rerecommend.changeCondition'))}</button></div></div>`;
    }
    h += S.re.recipes.map(x => {
      const done = S.re.cooked.has(x.r.name);
      const actions = `<button class="btn btn-s" data-act="cookRe" data-n="${esc(x.r.name)}"${done ? ' disabled' : ''}>${done ? lu('check') + esc(t('card.cookedDone')) : esc(t('card.cooked'))}</button>`;
      return card(x.r, { screen: 're', isNew: true, changed: x.changed, reason: x.reason, actions });
    }).join('');
  }
  if (S.re.prev.length){
    h += `<h2 class="sec">${esc(t('rerecommend.prevSection'))}</h2>` + S.re.prev.map(x => {
      const done = S.re.cooked.has(x.r.name);
      const actions = `<button class="btn btn-s" data-act="cookRe" data-n="${esc(x.r.name)}"${done ? ' disabled' : ''}>${done ? lu('check') + esc(t('card.cookedDone')) : esc(t('card.cooked'))}</button>`;
      return card(x.r, { screen: 'prev', reason: x.reason, actions });
    }).join('');
  }
  if (S.reHistory.length) h += `<button class="btn btn-s" data-act="prevRecipes" style="margin-top:8px">${lu('history')}${esc(t('rerecommend.prevRecipes'))}</button>`;
  // 해 먹은 요리가 있으면 다음 행동은 냉장고로 돌아가기예요. 되돌리기를 누르면 원래 하단 바로 돌아와요.
  if (S.re.cooked.size){
    return { html: h, dock: `<button class="btn btn-p" data-act="toFridge">${esc(t('rerecommend.toFridge'))}</button><p class="cap">${esc(t('rerecommend.cookedNote'))}</p>` };
  }
  h += `<button class="btn btn-s" data-act="toFridge" style="margin-top:8px">${esc(t('rerecommend.toFridge'))}</button>`;
  return { html: h, dock: `<button class="btn btn-p" data-act="again">${esc(t('rerecommend.again'))}</button><p class="cap">${esc(t('rerecommend.againNote'))}</p>` };
}

/* ───────── 렌더 ───────── */
const app = document.getElementById('app'), dock = document.getElementById('dock');
let lastView = null;
function render(){
  const v = { fridge: viewFridge, list: viewList, feedback: viewFeedback, re: viewRe }[S.view]();
  app.innerHTML = v.html;
  dock.innerHTML = v.dock ? `<div>${v.dock}</div>` : '';
  dock.hidden = !v.dock; app.classList.toggle('has-dock', !!v.dock);
  if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 2 } });
  if (lastView !== S.view){ window.scrollTo(0,0); lastView = S.view; }
}
function go(view){ S.view = view; render(); }
function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2000);
}

/* ───────── 해 먹었어요 (기획안 2-4) ───────── */
function cook(name, recipeObj){
  const e = evaluate(recipeObj, buildCtx());
  const out = L.cookedRemoval(e, SEASONING);
  const keptSeasoning = e.mine.length > out.length;
  S.lastRemoved = S.items.filter(x => out.includes(x.name)).map(x => ({...x}));
  out.forEach(removeItem); saveFridge();
  S.notice = t('card.cookedNotice', { recipe: name, list: out.length ? out.join(', ') : t('card.cookedNone') }) + (keptSeasoning ? t('card.cookedNoticeSeasoning') : '');
  window.scrollTo({ top: 0 });
}
function undo(){
  (S.lastRemoved || []).forEach(x => { if (!find(x.name)) S.items.push(x); });
  S.lastRemoved = null; S.notice = null; saveFridge();
}

/* ───────── 이벤트 ───────── */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, n = b.dataset.n;
  switch (a){
    case 'fill': FRIDGE_DATA.sampleFridge.forEach(x => addItem(x.name, x.daysLeft, false, x.shelfDays)); saveFridge(); render(); break;
    case 'sel': S.sel.has(n) ? S.sel.delete(n) : S.sel.add(n); render(); break;
    case 'toggleAdd': S.addOpen = !S.addOpen; render(); break;
    case 'tab': S.addTab = b.dataset.tab; render(); break;
    case 'chip': find(n) ? removeItem(n) : addItem(n, 7); saveFridge(); render(); break;
    case 'remove': removeItem(n); saveFridge(); render(); break;
    case 'scan': FRIDGE_DATA.receiptDemo.items.forEach(x => addItem(x.name, x.daysLeft, true)); S.receiptDone = true; saveFridge(); render(); break;
    case 'credits': S.creditsOpen = !S.creditsOpen; render(); break;
    case 'go':
      S.mode = b.dataset.mode; S.pickedName = null; S.notice = null; S.openSteps.clear(); resetSession(); S.reHistory = [];
      S.listLoading = true; go('list');
      setTimeout(() => { S.listLoading = false; render(); }, LIST_LOADING_MS);
      break;
    case 'toFridge': S.notice = null; S.lastRemoved = null; S.view = 'fridge'; render(); break;
    case 'pick': S.pickedName = n; render(); toast(t('toast.picked',{recipe:n})); break;
    case 'reject':
      S.fb = { from: 'list', targets: [RECIPES.find(r => r.name === n)], tags: [], error: false }; go('feedback'); break;
    case 'cook': cook(n, RECIPES.find(r => r.name === n)); if (S.pickedName === n) S.pickedName = null; render(); break;
    case 'undo': undo(); if (S.view === 're' && S.re.lastCooked){ S.re.cooked.delete(S.re.lastCooked); S.re.lastCooked = null; } render(); break;
    case 'like': {
      const k = b.dataset.key; S.liked[k] = !S.liked[k];
      const cnt = Number(b.dataset.base) + (S.liked[k] ? 1 : 0);
      b.setAttribute('aria-pressed', S.liked[k]); b.querySelector('b').textContent = cnt;
      b.setAttribute('aria-label', t('card.helpfulLabel',{n:cnt}));
      break;
    }
    case 'tag': {
      const k = b.dataset.k, i = S.fb.tags.indexOf(k);
      i > -1 ? S.fb.tags.splice(i,1) : S.fb.tags.push(k);
      b.setAttribute('aria-pressed', i < 0); S.fb.error = false;
      document.getElementById('fbErr').textContent = '';
      break;
    }
    case 'submitFb':
      if (!S.fb.tags.length){ S.fb.error = true; document.getElementById('fbErr').textContent = t('feedback.error'); return; }
      S.reHistory.push({ view: S.fb.from, session: { rejected: S.session.rejected.slice(), round: S.session.round },
        re: { tags: S.re.tags.slice(), recipes: S.re.recipes.slice(), prev: S.re.prev.slice(), relaxed: S.re.relaxed }, pickedName: S.pickedName });
      S.session = L.nextSession(S.session, S.fb.targets.map(r => r.id)); saveSession();
      S.re.tags = S.fb.tags.slice(); S.re.recipes = []; S.openSteps.clear();
      S.view = 're'; runRerecommend();
      break;
    case 'fbBack': S.fb.tags = []; S.fb.error = false; go(S.fb.from); break;
    case 'again':
    case 'reBack':
      S.fb = { from: 're', targets: S.re.recipes.length ? S.re.recipes.map(x => x.r) : S.fb.targets, tags: [], error: false };
      go('feedback'); break;
    case 'prevRecipes': {
      const prev = S.reHistory.pop(); if (!prev) break;
      S.session = prev.session; saveSession();
      S.re.tags = prev.re.tags; S.re.recipes = prev.re.recipes; S.re.prev = prev.re.prev; S.re.relaxed = prev.re.relaxed;
      S.re.cooked = new Set(); S.re.lastCooked = null; S.pickedName = prev.pickedName;
      S.notice = null; S.lastRemoved = null; S.openSteps.clear();
      go(prev.view); break;
    }
    case 'cookRe': {
      const x = S.re.recipes.concat(S.re.prev).find(y => y.r.name === n);
      cook(n, x.r); S.re.cooked.add(n); S.re.lastCooked = n; render(); break;
    }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.matches('input[type="date"][data-exp]')){
    const x = find(el.dataset.exp);
    if (x && /^\d{4}-\d{2}-\d{2}$/.test(el.value)){ x.expiryDate = el.value; saveFridge(); render(); }
  } else if (el.id === 'receiptFile' && el.files[0]){
    const r = new FileReader();
    r.onload = () => { S.receiptPreview = r.result; S.receiptDone = false; render(); };   // 영수증 이미지는 저장하지 않아요
    r.readAsDataURL(el.files[0]);
  }
});
document.addEventListener('toggle', ev => {
  const d = ev.target;
  if (d.matches && d.matches('details[data-steps]')) d.open ? S.openSteps.add(d.dataset.steps) : S.openSteps.delete(d.dataset.steps);
}, true);

/* ───────── 시작 화면 (탭을 처음 열 때만, 누르면 건너뛰기) ───────── */
const SPLASH_KEY = 'naengbu:splash:v1';
function splash(){
  let seen = false;
  try { seen = sessionStorage.getItem(SPLASH_KEY) === '1'; sessionStorage.setItem(SPLASH_KEY, '1'); } catch(e){}
  if (seen || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const items = [['대파',-80,-112,-12],['계란',-30,-146,8],['두부',30,-146,-6],['당근',82,-108,14],['김치',-98,-46,-8],['토마토',98,-42,10]];
  const el = document.createElement('div');
  el.id = 'splash'; el.setAttribute('aria-hidden', 'true');
  el.innerHTML = '<div class="sp-stage"><div class="sp-fridge"><div class="sp-door"></div></div>'
    + items.map(([n,x,y,r], i) => {
        const m = ICON_MAP.icons[n], src = m && ICON_SRC[m.file];
        return src ? `<span class="sp-item" style="--x:${x}px;--y:${y}px;--r:${r}deg;--d:${(0.8 + i * 0.09).toFixed(2)}s"><img src="${src}" alt=""></span>` : '';
      }).join('')
    + `</div><p class="sp-title">${esc(t('app.title'))}</p><p class="sp-tag">${esc(t('app.tagline'))}</p>`;
  document.body.appendChild(el);
  let done = false;
  const finish = () => {
    if (done) return; done = true;
    el.classList.add('out'); app.classList.add('enter');
    setTimeout(() => el.remove(), 550);
  };
  el.addEventListener('click', finish);
  setTimeout(finish, 2600);
}

loadFridge();
render();
splash();
})();
</script>
